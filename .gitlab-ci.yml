stages:
  - lint
  - test
  - build
  - release
  - publish
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PYTHONUNBUFFERED: "1"

default:
  image: python:3.12-slim
  cache:
    key: "python-pip-${CI_COMMIT_REF_SLUG}"
    paths:
      - .cache/pip

# ==========================================
# STAGE: LINT
# ==========================================
lint:ruff:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install ruff
  script:
    - echo "🔍 Ejecutando análisis estático con Ruff..."
    - ruff check .
    - echo "🎨 Verificando formato de código..."
    - ruff format --check .

# ==========================================
# STAGE: TEST
# ==========================================
test:pytest:
  stage: test
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install .[dev]
  script:
    - echo "🧪 Ejecutando suite de tests automatizados del SDK..."
    - pytest tests/

# ==========================================
# STAGE: BUILD (Compilación determinista)
# ==========================================
build:package:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - python -m pip install --upgrade pip
    - pip install build
  script:
    - echo "📦 Compilando paquete Python (sdist y wheel)..."
    - python -m build
  artifacts:
    name: "dist-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 1 week

# ==========================================
# STAGE: RELEASE (GitLab Package Registry)
# ==========================================
release:package_registry:
  stage: release
  needs:
    - test:pytest
    - build:package
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
    - if: $CI_COMMIT_TAG
  before_script:
    - python -m pip install --upgrade pip
    - pip install twine build
  script:
    - 'echo "📦 Publicando artefactos en GitLab Package Registry (ID: ${CI_PROJECT_ID})..."'
    - 'python -m build'
    - 'TWINE_PASSWORD=${CI_JOB_TOKEN} TWINE_USERNAME=gitlab-ci-token python -m twine upload --repository-url ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi dist/*'
    - 'echo "✅ Artefactos publicados exitosamente en GitLab Package Registry con CI_JOB_TOKEN."'

# ==========================================
# STAGE: PUBLISH (PyPI Oficial - pypi.org)
# ==========================================
publish:pypi:
  stage: publish
  needs:
    - build:package
  rules:
    - if: $CI_COMMIT_TAG && $PYPI_TOKEN
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  before_script:
    - python -m pip install --upgrade pip
    - pip install twine
  script:
    - 'test -n "$PYPI_TOKEN" || (echo "❌ ERROR: Variable PYPI_TOKEN no configurada en las variables de CI/CD de GitLab." && exit 1)'
    - 'echo "🚀 Publicando jg-agente-sdk en PyPI oficial (pypi.org)..."'
    - 'TWINE_USERNAME="__token__" TWINE_PASSWORD="$PYPI_TOKEN" python -m twine upload --skip-existing dist/*'
    - 'echo "✅ ¡Paquete publicado exitosamente en PyPI! Instalable con: pip install jg-agente-sdk"'

# ==========================================
# STAGE: DEPLOY (Mirror Público a GitHub)
# ==========================================
sync_to_github:
  stage: deploy
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: "0"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'
  script:
    - |
      if [ -z "${GITHUB_TOKEN:-}" ]; then
        echo "⚠️ GITHUB_TOKEN no definido. Omitiendo sincronización con GitHub."
        exit 0
      fi
    - GH_USER="${GITHUB_USER:-cabocom}"
    - TARGET_REPO="${CI_PROJECT_NAME}"
    - git config --global user.email "bot@javiergalvez.com"
    - git config --global user.name "GitLab Mirror Bot"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://${GH_USER}:${GITHUB_TOKEN}@github.com/${GH_USER}/${TARGET_REPO}.git"
    - git fetch origin --tags --force
    - |
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
        echo "🏷️ Sincronizando tag ${CI_COMMIT_TAG} hacia https://github.com/${GH_USER}/${TARGET_REPO}..."
        git push --force github "refs/tags/${CI_COMMIT_TAG}:refs/tags/${CI_COMMIT_TAG}"
      else
        echo "🚀 Sincronizando rama ${CI_DEFAULT_BRANCH} y tags hacia https://github.com/${GH_USER}/${TARGET_REPO}..."
        git push --force github "HEAD:refs/heads/${CI_DEFAULT_BRANCH}" --tags
      fi

